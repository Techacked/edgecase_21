services:
  - type: web
    name: edgecase-api
    runtime: python
    rootDir: Backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: edgecase-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: edgecase-web
    runtime: node
    rootDir: Frontend
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: edgecase-api
          envVarKey: RENDER_EXTERNAL_URL
